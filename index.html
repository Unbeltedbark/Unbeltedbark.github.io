<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Privacy policies · .//Talentless/x/Hack</title>
  <style>
    :root { --bg:#0e1116; --card:#181e27; --border:#2e3848; --text:#eef2f7; --muted:#8f9cb0; --accent:#ffb020; --ok:#4cc9a0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Khmer", sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; padding: 20px 16px 48px; }
    main { max-width: 640px; margin: 0 auto; }

    h2 { font-size: 1rem; color: var(--accent); margin: 20px 0 8px; }
    p, li, td, th { font-size: 0.95rem; }
    ul { padding-left: 1.2rem; margin-top: 8px; }
    li { margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.82rem; }
    .badge { display: inline-block; background: rgba(255,176,32,.12); color: var(--accent); border: 1px solid rgba(255,176,32,.35); border-radius: 999px; padding: 4px 10px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; }
    a { color: var(--ok); }

</style>
</head>
